  ### getLogLevel ###
  GetLogLevel.Request: #request
    type: object
    required: [method]
    properties:
      method: { const: "get_log_level" }

  GetLogLevel.Response: #response
    type: object
    required: [success]
    properties:
      success: { $ref: "#/$defs/AdaptyLog.Level" }

  ### setLogLevel ###
  SetLogLevel.Request: #request
    type: object
    required: [method, value]
    properties:
      method: { const: "set_log_level" }
      value: { $ref: "#/$defs/AdaptyLog.Level" }

  SetLogLevel.Response: #response
    type: object
    required: [success]
    properties:
      success: { const: true }

  ### logout ###
  Logout.Request: #request
    type: object
    required: [method]
    properties:
      method: { const: "logout" }

  Logout.Response: #response
