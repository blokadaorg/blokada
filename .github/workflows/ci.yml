name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Every job runs on a GitHub-hosted runner, a fresh VM per job. PR code is
# untrusted -- a dependency bump runs third-party code here -- so none of it
# builds on the self-hosted Mac, where it could leave something behind. That
# Mac only runs the Appium jobs, which need its phone.
jobs:
  changes:
    name: Changed paths
    # Sorts the PR's changed files into the areas the jobs below check, so a
    # docs or workflow PR does not wait on app builds. A skipped job counts as
    # passed. A manual run checks everything. The Appium smoke workflows read
    # the same result from the ci-changes artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.classify.outputs.app }}
      translations: ${{ steps.classify.outputs.translations }}
      release_scripts: ${{ steps.classify.outputs.release_scripts }}
      appium: ${{ steps.classify.outputs.appium }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # Check everything for an action bump, since the jobs are what run
          # the bumped actions and Dependabot auto-merge relies on them, and
          # past the 3000 files the files API lists.
          if [ "$EVENT" != pull_request ] || [ "${CHANGED_FILES:-0}" -ge 3000 ] ||
            [[ "$HEAD_REF" == dependabot/github_actions/* ]]; then
            files=ALL
          else
            # A rename counts for both its old and its new path.
            files="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)')"
          fi
          printf '%s\n' "$files"
          matches() {
            [ "$files" = ALL ] || grep -qE "$1" <<<"$files"
          }
          {
            matches '^(common|android|ios|deps|\.github/actions)/|^(Makefile|\.gitmodules)$' \
              && echo app=true || echo app=false
            matches '^deps/translate(/|$)|^common/assets/translations/' \
              && echo translations=true || echo translations=false
            matches '^scripts/|^Makefile$|^\.github/workflows/(ci-release|promote|store-rollout)\.yml$' \
              && echo release_scripts=true || echo release_scripts=false
            matches '^automation/appium/' \
              && echo appium=true || echo appium=false
          } | tee -a "$GITHUB_OUTPUT" > changes

      - name: Upload the result for the smoke workflows
        uses: actions/upload-artifact@v7
        with:
          name: ci-changes
          path: changes
          retention-days: 7

  translations_drift:
    name: en.json drift
    # Source-bypass guard: the committed English JSON under
    # common/assets/translations/*/en.json is generated from the pinned
    # deps/translate submodule's v6/*.strings. Regenerate and fail if they
    # differ, so a string can never reach the app without coming from source
    # (this is the bypass that shipped the June family strings as English).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.translations == 'true'
    env:
      # convert.py writes raw UTF-8 via the locale's preferred encoding; pin a
      # UTF-8 locale so non-ASCII source strings round-trip byte-for-byte.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Only deps/translate is needed; avoid cloning the heavy sibling
      # submodules (wireguard-apple, etc.) that the build jobs require.
      - name: Init deps/translate submodule
        run: git submodule update --init --depth 1 deps/translate

      - name: Regenerate en.json from pinned source strings
        working-directory: deps/translate/scripts
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/common/assets/translations"
          python3 ./convert.py -i ../v6/Ui.strings       -o "$out/ui/en.json"       -f flutter
          python3 ./convert.py -i ../v6/Packs.strings    -o "$out/packs/en.json"    -f flutter
          python3 ./convert.py -i ../v6/PackTags.strings -o "$out/packtags/en.json" -f flutter

      - name: Fail if regenerated en.json differs from committed
        run: |
          git diff --exit-code -- \
            common/assets/translations/ui/en.json \
            common/assets/translations/packs/en.json \
            common/assets/translations/packtags/en.json

  release_scripts:
    name: Release script tests
    # Covers the release-pipeline invariants that are expensive once broken:
    # monotonic store version codes, the offset applied exactly once, and the
    # App Store state table that decides whether a promote run may start.
    # bash + git + python3 + ruby only -- all preinstalled on ubuntu-latest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.release_scripts == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The allocator tests push tags to a throwaway local remote.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@blokada.org"
          git config --global user.name "blokada-ci"

      - name: Run build-number, version and release-state tests
        run: make test-scripts

  flutter_analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Skip for the automated translations-sync PRs: a translation-only diff
    # can't affect the binary, so don't spend a build on them.
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' &&
      !startsWith(github.head_ref, 'automation/translations-sync/')
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      # Must run before `make pub`, which would rewrite a bad lock and hide it.
      - name: Verify pubspec.lock resolves under the pinned Flutter
        working-directory: common
        run: make pub-verify

      - name: Analyze Flutter module
        working-directory: common
        run: |
          make pub gen
          fvm flutter analyze --no-fatal-warnings --no-fatal-infos

  flutter_test:
    name: Flutter test
    # Unit, widget and golden tests for the Flutter module. Runs alongside the
    # builds rather than gating them: a failure turns the PR red within
    # minutes either way, and gating would delay every green PR.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' &&
      !startsWith(github.head_ref, 'automation/translations-sync/')
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      - name: Run Flutter tests
        working-directory: common
        run: |
          make pub gen
          fvm flutter test --no-pub -r failures-only

      # Goldens are compared on Linux only; on a mismatch flutter_test writes
      # the master, test and diff images here.
      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-failures-${{ github.run_id }}
          path: common/test/golden/failures/
          if-no-files-found: ignore

  ios_build:
    name: iOS build
    # Same image and Xcode as the release archive in ci-release.yml.
    runs-on: xcode-27
    timeout-minutes: 120
    # Skip for the automated translations-sync PRs: a translation-only diff
    # can't affect the binary, so don't spend a build on them.
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' &&
      !startsWith(github.head_ref, 'automation/translations-sync/')
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      SHOW_XCODE_LOG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/setup-wireguard-go

      - name: Bootstrap Flutter common lib
        # Builds the add-to-app xcframeworks the host project embeds.
        run: make -C common build-ios

      - name: Build iOS six debug
        run: make -C ios check CHECK_SCHEME=Dev CHECK_CONFIG=Debug

      - name: Build iOS family debug
        run: make -C ios check CHECK_SCHEME=FamilyDev CHECK_CONFIG=Debug

  android_assemble:
    name: Android assemble
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Skip for the automated translations-sync PRs: a translation-only diff
    # can't affect the binary, so don't spend a build on them.
    needs: changes
    if: >-
      needs.changes.outputs.app == 'true' &&
      !startsWith(github.head_ref, 'automation/translations-sync/')
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      GRADLE_OPTS: -Dorg.gradle.unsafe.disable.watch-fs=true -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      - name: Build Flutter Android debug library
        run: make regen-android

      - name: Assemble Android debug apps
        run: make -C android apk-family-debug apk-six-debug

      # Release assembles run R8. A native-dependency bump that only breaks
      # under shrinking passes the debug assemble above and surfaces only on
      # CI Release — #1222 (adapty-bom 4.1.0 renaming a class the vendored
      # Flutter bridge references) merged green and broke every release build
      # that followed. No keystore env here, so the APKs are unsigned.
      - name: Build Flutter Android release library
        run: make -C common lib

      - name: Assemble Android release apps (R8)
        run: make -C android apk-family apk-six
