  ### makePurchase ###
  MakePurchase.Request: #request
    type: object
    required: [method, product]
    properties:
      method: { const: "make_purchase" }
      product: { $ref: "#/$defs/AdaptyPaywallProduct.Request" }
      parameters:
        {
          $ref: "#/$defs/AdaptyPurchaseParameters",
          description: "Android Only",
        }

  MakePurchase.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { $ref: "#/$defs/AdaptyPurchaseResult" }

  OpenWebPaywall.Request: #request
    type: object
    required: [method]
    oneOf:
      - required: [product]
      - required: [paywall]
    properties:
      method: { const: "open_web_paywall" }
      product: { $ref: "#/$defs/AdaptyPaywallProduct.Request" }
      paywall: { $ref: "#/$defs/AdaptyFlowPaywall" }
      open_in: { $ref: "#/$defs/AdaptyWebPresentation", default: "browser_out_app" }

  OpenWebPaywall.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

  CreateWebPaywallUrl.Request: #request
    type: object
    required: [method]
    oneOf:
      - required: [product]
      - required: [paywall]
    properties:
      method: { const: "create_web_paywall_url" }
      product: { $ref: "#/$defs/AdaptyPaywallProduct.Request" }
