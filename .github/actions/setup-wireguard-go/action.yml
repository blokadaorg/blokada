name: Set up Go for the WireGuard bridge
description: >-
  Installs the Go release the WireGuard Go bridge builds with, at the path its
  build script expects. Needed by any job that builds the iOS host project on
  a GitHub-hosted runner.

runs:
  using: composite
  steps:
    # The bridge patches the Go runtime, so it needs the Go release that patch
    # applies to, and its build script (in the wireguard-apple submodule) looks
    # for it at Homebrew's go@1.22 path. The hosted images only carry newer Go
    # releases.
    - uses: actions/setup-go@v7
      with:
        go-version: "1.22.12"
        cache: false

    - name: Put Go where the WireGuard bridge build looks for it
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /opt/homebrew/opt/go@1.22/bin
        ln -sf "$(go env GOROOT)/bin/go" /opt/homebrew/opt/go@1.22/bin/go
        /opt/homebrew/opt/go@1.22/bin/go version
