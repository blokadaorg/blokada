      success: { type: string }

  ### setFallback ###
  SetFallback.Request: #request
    type: object
    required: [method]
    properties:
      method: { const: "set_fallback" }
    oneOf:
      - required: [asset_id]
        properties:
          asset_id: { type: string }
      - required: [path]
        properties:
          path: { type: string }

  SetFallback.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

