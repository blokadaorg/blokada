$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://adapty.io/crossPlatform/4.0.2/schema"
title: "Cross Platform Format"

$requests:
  ### activate ###
  Activate.Request: #request
    type: object
    required: [method, configuration]
    properties:
      method: { const: "activate" }
      configuration: { $ref: "#/$defs/AdaptyConfiguration" }

  Activate.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

  ### createFlowView ###
  AdaptyUICreateFlowView.Request: #request
    type: object
    required:
      - method
      - flow
    properties:
      method: { const: "adapty_ui_create_flow_view" }
      flow: { $ref: "#/$defs/AdaptyFlow" }
      locale: { $ref: "#/$defs/AdaptyLocale" }
      load_timeout: { type: number, description: "seconds" }
      preload_products: { type: boolean, default: false }
      custom_tags: { $ref: "#/$defs/AdaptyUI.CustomTagsValues" }
      custom_timers: { $ref: "#/$defs/AdaptyUI.CustomTimersValues" }
      custom_assets: { $ref: "#/$defs/AdaptyUI.CustomAssets" }
      product_purchase_parameters:
        {
          $ref: "#/$defs/AdaptyUI.ProductPurchaseParameters",
          description: "Android Only",
        }
      enable_safe_area_paddings: { type: boolean, default: true, description: "Android Only" }

  AdaptyUICreateFlowView.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { $ref: "#/$defs/AdaptyUI.FlowView" }

  ### createOnboardingView ###
  AdaptyUICreateOnboardingView.Request: #request
    type: object
    required:
      - method
      - onboarding
    properties:
      method: { const: "adapty_ui_create_onboarding_view" }
      onboarding: { $ref: "#/$defs/AdaptyOnboarding" }
      external_urls_presentation: { $ref: "#/$defs/AdaptyWebPresentation" }

  AdaptyUICreateOnboardingView.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { $ref: "#/$defs/AdaptyUI.OnboardingView" }

  ### dismissOnboardingView ###
  AdaptyUIDismissOnboardingView.Request: #request
    type: object
    required: [method, id]
    properties:
      method: { const: "adapty_ui_dismiss_onboarding_view" }
      id: { type: string, description: "View Id" }
      destroy: { type: boolean, default: false }

  AdaptyUIDismissOnboardingView.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

  ### dismissFlowView ###
  AdaptyUIDismissFlowView.Request: #request
    type: object
    required: [method, id]
    properties:
      method: { const: "adapty_ui_dismiss_flow_view" }
      id: { type: string, description: "View Id" }
      destroy: { type: boolean, default: false }

  AdaptyUIDismissFlowView.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

  ### presentOnboardingView ###
  AdaptyUIPresentOnboardingView.Request: #request
    type: object
    required: [method, id]
    properties:
      method: { const: "adapty_ui_present_onboarding_view" }
      id: { type: string, description: "View Id" }
      ios_presentation_style: { $ref: "#/$defs/AdaptyUI.IOSPresentationStyle" }

  AdaptyUIPresentOnboardingView.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

  ### presentFlowView ###
  AdaptyUIPresentFlowView.Request: #request
    type: object
    required: [method, id]
    properties:
      method: { const: "adapty_ui_present_flow_view" }
      id: { type: string, description: "View Id" }
      ios_presentation_style: { $ref: "#/$defs/AdaptyUI.IOSPresentationStyle" }

  AdaptyUIPresentFlowView.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

  ### adaptyUIShowDialog ###
  AdaptyUIShowDialog.Request: #request
    type: object
    required: [method, id, configuration]
    properties:
      method: { const: "adapty_ui_show_dialog" }
      id: { type: string, description: "View Id" }
      configuration: { $ref: "#/$defs/AdaptyUI.DialogConfiguration" }

  AdaptyUIShowDialog.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { $ref: "#/$defs/AdaptyUI.DialogActionType" }

  ### adaptyUIOpenUrl ###
  AdaptyUIOpenUrl.Request: #request
    type: object
    required: [method, url]
    properties:
      method: { const: "adapty_ui_open_url" }
      url: { type: string }
      open_in: { $ref: "#/$defs/AdaptyWebPresentation", default: "browser_out_app" }

  AdaptyUIOpenUrl.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

  ### adaptyUIRequestAppReview ###
  AdaptyUIRequestAppReview.Request: #request
    type: object
    required: [method]
    properties:
      method: { const: "adapty_ui_request_app_review" }

  AdaptyUIRequestAppReview.Response: #response
    type: object
    oneOf:
      - required: [error]
        properties:
          error: { $ref: "#/$defs/AdaptyError" }
      - required: [success]
        properties:
          success: { const: true }

  ### getOnboarding ###
  GetOnboarding.Request: #request
    type: object
    required: [method, placement_id]
    properties:
      method: { const: "get_onboarding" }
      placement_id: { type: string }
      locale: { $ref: "#/$defs/AdaptyLocale" }
      fetch_policy: { $ref: "#/$defs/AdaptyPlacementFetchPolicy" }
      load_timeout: { type: number, description: "seconds" }

  GetOnboarding.Response: #response
