name: TMP verify hosted release runners

# TEMPORARY -- delete before merge. Proves the hosted-runner toolchain that
# ci-release.yml and promote.yml now depend on, without any secret: release
# builds are left unsigned and nothing is uploaded.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tmp-verify-hosted-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      BLOKADA_VERSION_NAME: 26.10.1
      BLOKADA_VERSION_CODE: 1
      GRADLE_OPTS: -Dorg.gradle.unsafe.disable.watch-fs=true -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      - name: Build Android AAB (six, unsigned)
        run: make ci-build-android-six

      - name: Check the AAB exists
        run: ls -la android/app/build/outputs/bundle/sixRelease/app-six-release.aab

      # publish-android and promote-android call the image's global fastlane,
      # and verify-play-version-code.rb needs its supply library under `ruby`.
      - name: Check fastlane and supply
        run: |
          set -euo pipefail
          fastlane --version
          ruby -e 'require "supply"; puts "supply ok"'

      - name: Check build-number resolve
        run: ./scripts/build-number.sh resolve latest

  ios:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version

      - uses: ./.github/actions/setup-flutter

      - name: Install fastlane
        working-directory: ios
        run: bundle install

      # actions/runner-images#14837 reports unlock-keychain failing on this
      # image. Exercise the exact create_keychain call ci_signing makes.
      - name: Check keychain creation and unlock
        working-directory: ios
        run: |
          set -euo pipefail
          bundle exec fastlane run create_keychain name:tmp-verify password:tmp-verify-pw \
            default_keychain:true unlock:true timeout:0 lock_when_sleeps:false \
            add_to_search_list:true require_create:true
          security unlock-keychain -p tmp-verify-pw ~/Library/Keychains/tmp-verify-db
          security show-keychain-info ~/Library/Keychains/tmp-verify-db
          security default-keychain
          gh api meta --jq '.ssh_keys | length'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bootstrap Flutter common lib
        run: make -C common build-ios

      # Device Release build of the shipping scheme, unsigned: everything the
      # archive compiles (including the WireGuard Go bridge) short of signing.
      - name: Build iOS six release (unsigned)
        working-directory: ios
        run: |
          set -euo pipefail
          make -C BlockaWebExtension gen-rules
          xcodebuild build -workspace IOS.xcworkspace -scheme Prod -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || { tail -200 "$RUNNER_TEMP/xcodebuild.log"; exit 1; }
          tail -5 "$RUNNER_TEMP/xcodebuild.log"

      - name: Disk left
        if: always()
        run: df -h /

  promote_ios_toolchain:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install fastlane
        working-directory: ios
        run: bundle install

      - name: Check the Fastfile loads
        working-directory: ios
        run: bundle exec fastlane lanes
