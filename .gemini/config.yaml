# Gemini Code Assist is one of the PR reviewers an agent rotates through when
# another one hits its limit, so it reviews only when asked (`/gemini review`),
# not when a PR opens.
# Schema: https://docs.cloud.google.com/gemini/docs/code-review/customize-repo-review
have_fun: false
code_review:
  comment_severity_threshold: MEDIUM
  pull_request_opened:
    help: false
    summary: false
    code_review: false
# Generated or downloaded: Adapty fallback exports, translations from the
# translate submodule, lockfiles and Pigeon output.
ignore_patterns:
  - "common/assets/fallbacks/**"
  - "android/app/src/main/assets/fallbacks/**"
  - "common/assets/translations/**"
  - "android/app/src/main/assets/translations/**"
  - "**/pubspec.lock"
  - "**/package-lock.json"
  - "ios/App/Common.swift"
  - "ios/ChannelStatic/Url.swift"
