version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/common"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      flutter-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        # pigeon's semver-major ignore (below) does not keep it out of this
        # group's recreated PRs — when a grouped dep merges, Dependabot
        # recreates the group and re-widens the pigeon constraint, re-bumping
        # it to 26.x and going red on the setup→setUp break (closed #1106,
        # #1109, #1114). Excluding pigeon from the group keeps the safe
        # minor/patch bumps unblocked; pigeon minor/patch then gets its own
        # PR and its major stays held by the ignore rule. Drop this together
        # with the ignore when the pigeon 26 native migration is scheduled.
        exclude-patterns:
          - "pigeon"
          # Same group-recreation trap as pigeon, and the reason the pubspec
          # pin from #1267 did not hold: Dependabot rewrote the constraint
          # back to `^2.6.0` on the very next recreation of this group (#1263).
          - "flutter_chat_core"
          - "flutter_chat_ui"
        update-types:
          - "minor"
          - "patch"
      flutter-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # pigeon 26 needs a native Swift/Kotlin codegen migration (Kotlin enum
      # renames + Swift PigeonError collision) that's disproportionate for a
      # dev-only codegen tool; held — see closed PR #1106. Remove this when
      # that migration is scheduled.
      - dependency-name: "pigeon"
        update-types: ["version-update:semver-major"]
      # flutter_chat_core 2.9.1 and flutter_chat_ui 2.12.0 replaced their
      # `package:flutter/material` imports with pub's `package:material_ui`.
      # Flutter 3.44's SDK material is an independent copy of that package
      # rather than a re-export, so the two ThemeData/Material types are
      # unrelated: the support chat stops compiling, and once the call sites
      # are fixed its composer still dies at runtime with "No Material widget
      # found" (see #1267). Note this cannot be a semver-major ignore like
      # pigeon's — upstream shipped the break as a patch and a minor, so every
      # update type has to be held. Remove this when the support chat subtree
      # gets a material_ui host of its own.
      - dependency-name: "flutter_chat_core"
      - dependency-name: "flutter_chat_ui"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      android-gradle:
        applies-to: version-updates
        patterns:
          - "*"
        # Same trap as pigeon in the pub group: a grouped PR is recreated
        # whenever one of its members merges, so an ignored dependency can be
        # dragged back in through the group. Exclude the Adapty BOM here so the
        # ignore rule below is the only thing that decides when it moves.
        exclude-patterns:
          - "io.adapty:adapty-bom"
        update-types:
          - "minor"
          - "patch"
      android-gradle-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # The Adapty BOM is not an independent dependency: it must equal the BOM
      # that common/vendor/adapty_flutter/android/build.gradle pins, because the
      # crossplatform bridge is compiled against that exact native release.
      # Bumping it alone breaks the release build under R8 — 4.1.0 renamed
      # AdaptyAttributionSource with no alias and #1222 went green on debug CI
      # while `:app:minifySixReleaseWithR8` failed on CI Release. It is bumped
      # together with the vendored adapty_flutter, never alone; remove this when
      # the plugin upgrade makes the BOM independently bumpable.
      - dependency-name: "io.adapty:adapty-bom"

  - package-ecosystem: "npm"
    directory: "/ios/BlockaWebExtension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      safari-extension-npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      safari-extension-npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/automation/appium/wdio"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      appium-wdio-npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      appium-wdio-npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:30"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
