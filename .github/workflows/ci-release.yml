name: CI Release

# Every merge to main is built and shipped to internal channels, so main is
# continuously proven publishable -- PR CI never archives, signs or uploads,
# which is how the ITMS-91065 regression reached a release.
#
# No path filters on purpose: filtering would leave commits on main that were
# never proven, which is the gap this closes.
on:
  push:
    branches:
      - main

permissions:
  contents: write # pushes build/* tags

# Queue rather than cancel: cancelling mid-flight strands a consumed build
# number and a half-finished upload.
#
# Shared with release.yml: both workflows write the same Play packages, and
# Play invalidates an open edit whose underlying app state changed, so a merge
# landing mid-release would break one side or the other. A merge queues behind
# a release rather than cancelling it.
concurrency:
  group: store-publish
  cancel-in-progress: false

# Every job runs on a GitHub-hosted runner: a fresh VM per job, discarded
# afterwards. Nothing here may move back to the self-hosted Mac -- it runs PR
# code (the Appium jobs need its phone), and whatever a PR leaves behind on a
# long-lived host would run again inside the next job that holds the signing
# keys.
#
# The jobs that hold those keys also name the `release` environment. It only
# deploys from main, so once the keys live there instead of at repo level, a
# workflow on any other ref cannot read them.
jobs:
  allocate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the build/N tag
    outputs:
      build_number: ${{ steps.alloc.outputs.build_number }}
      version_name: ${{ steps.alloc.outputs.version_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Allocate build number
        id: alloc
        run: |
          set -euo pipefail
          git config user.email "ci@blokada.org"
          git config user.name "blokada-ci"
          ./scripts/build-number.sh allocate --start 1000 >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Summary
        env:
          BUILD_NUMBER: ${{ steps.alloc.outputs.build_number }}
          VERSION_NAME: ${{ steps.alloc.outputs.version_name }}
        run: |
          {
            echo "### Build"
            echo "- number: \`$BUILD_NUMBER\`"
            echo "- version: \`$VERSION_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

  translation_coverage:
    # Informational only: report per-locale coverage for the primary languages
    # to the run summary and warn (never fail) on anything below 100%, since
    # translation lag is normal. Independent of the build jobs -- no needs on
    # allocate, and nothing needs it -- so it runs in parallel and cannot
    # block this run.
    #
    # Moved here from the retired release-tag.yml so lag surfaces on every
    # merge to main, days before release, instead of only at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out, inits a submodule, and reports -- never pushes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Coverage only reads deps/translate/langs.js; skip the heavy siblings.
      # continue-on-error on both steps keeps this job from ever reddening a
      # run: a red ci-release run means main is not publishable, and
      # translation lag -- which is normal -- must never produce that signal.
      - name: Init deps/translate submodule
        continue-on-error: true
        run: git submodule update --init --depth 1 deps/translate

      - name: Report per-locale coverage
        continue-on-error: true
        run: python3 .github/scripts/translation_coverage.py

  android:
    needs: allocate
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 240
    permissions:
      contents: read # builds and uploads with its own secrets, never pushes to the repo
    strategy:
      fail-fast: false
      matrix:
        flavor: [six, family]
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FLAVOR: ${{ matrix.flavor }}
      BLOKADA_VERSION_NAME: ${{ needs.allocate.outputs.version_name }}
      BLOKADA_VERSION_CODE: ${{ needs.allocate.outputs.build_number }}
      BLOKADA_KEYSTORE_BASE64: ${{ secrets.BLOKADA_KEYSTORE_BASE64 }}
      BLOKADA_KEYSTORE_PWD: ${{ secrets.BLOKADA_KEYSTORE_PWD }}
      BLOKADA_KEY_PWD: ${{ secrets.BLOKADA_KEY_PWD }}
      GRADLE_OPTS: -Dorg.gradle.unsafe.disable.watch-fs=true -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ./.github/actions/setup-flutter

      - name: Build Android AAB
        run: |
          set -euo pipefail
          if [ "$FLAVOR" = "family" ]; then
            make ci-build-android-family
          else
            make ci-build-android-six
          fi

      - name: Upload to Play internal
        env:
          BLOKADA_GPLAY_KEY_BASE64: ${{ secrets.BLOKADA_GPLAY_KEY_BASE64 }}
        run: make publish-android FLAVOR="$FLAVOR"

      - name: Clean secrets
        if: always()
        run: |
          make gplay-key-clean
          rm -f android/keystore.jks

  ios:
    needs: allocate
    # Preview label for the macOS 27 image, the only hosted one with Xcode 27.
    # Expect it to be renamed when the image goes GA.
    runs-on: xcode-27
    environment: release
    timeout-minutes: 240
    permissions:
      contents: read # builds and uploads with its own secrets, never pushes to the repo
    strategy:
      fail-fast: false
      matrix:
        flavor: [six, family]
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FLAVOR: ${{ matrix.flavor }}
      BLOKADA_VERSION_NAME: ${{ needs.allocate.outputs.version_name }}
      BLOKADA_VERSION_CODE: ${{ needs.allocate.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      # Pinned rather than left at the image default: the SDK an app links
      # against changes how iOS treats it at runtime, so it moves on purpose.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      - uses: ./.github/actions/setup-flutter

      - uses: ./.github/actions/setup-wireguard-go

      - name: Install fastlane
        working-directory: ios
        run: bundle install

      # The cert and profiles come from the match repo over a read-only deploy
      # key. GitHub's host keys are taken from its API over TLS instead of
      # being trusted on first connect.
      - name: Install signing identity
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$MATCH_PASSWORD" ] || [ -z "$MATCH_DEPLOY_KEY" ]; then
            echo "::error::MATCH_PASSWORD and MATCH_DEPLOY_KEY must be set on the release environment."
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          gh api meta --jq '.ssh_keys[] | "github.com \(.)"' >> ~/.ssh/known_hosts
          key="$RUNNER_TEMP/match_deploy_key"
          printf '%s\n' "$MATCH_DEPLOY_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          MATCH_GIT_PRIVATE_KEY="$key" make ci-ios-signing FASTLANE="bundle exec fastlane"

      - name: Build iOS IPA
        run: |
          set -euo pipefail
          if [ "$FLAVOR" = "family" ]; then
            make ci-build-ios-family
          else
            make ci-build-ios-six
          fi

      - name: Upload to TestFlight
        env:
          BLOKADA_APPSTORE_KEY_BASE64: ${{ secrets.BLOKADA_APPSTORE_KEY_BASE64 }}
        run: |
          set -uo pipefail

          started=$SECONDS
          if make publish-ios-testflight FLAVOR="$FLAVOR" FASTLANE="bundle exec fastlane"; then
            exit 0
          fi
          elapsed=$((SECONDS - started))

          # altool can die within ~60s with only "The file Defaults.properties
          # couldn't be opened". Nothing has been sent that early, so the same
          # build number can be uploaded again. Later failures are not retried.
          if [ "$elapsed" -ge 180 ]; then
            echo "::error::Upload failed after ${elapsed}s; not retrying."
            exit 1
          fi

          # Tells a network problem on the runner apart from an altool one.
          curl -s -o /dev/null -m 20 \
            -w "probe http=%{http_code} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s err=%{errormsg}\n" \
            https://contentdelivery.itunes.apple.com/transporter/Defaults.properties \
            || echo "probe: curl exited $?"

          echo "::warning::Upload failed after ${elapsed}s; retrying once."
          sleep 30
          make publish-ios-testflight FLAVOR="$FLAVOR" FASTLANE="bundle exec fastlane"

      - name: Clean App Store key
        if: always()
        run: make appstore-key-clean
