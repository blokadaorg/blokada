name: CI Release

# Every merge to main is built and shipped to internal channels, so main is
# continuously proven publishable -- PR CI never archives, signs or uploads,
# which is how the ITMS-91065 regression reached a release.
#
# No path filters on purpose: filtering would leave commits on main that were
# never proven, which is the gap this closes.
on:
  push:
    branches:
      - main

permissions:
  contents: write # pushes build/* tags

# Queue rather than cancel: cancelling mid-flight strands a consumed build
# number and a half-finished upload.
#
# Shared with release.yml: both workflows write the same Play packages, and
# Play invalidates an open edit whose underlying app state changed, so a merge
# landing mid-release would break one side or the other. A merge queues behind
# a release rather than cancelling it.
concurrency:
  group: store-publish
  cancel-in-progress: false

jobs:
  allocate:
    runs-on: [self-hosted, macOS, ARM64, build-only]
    timeout-minutes: 10
    permissions:
      contents: write # pushes the build/N tag
    outputs:
      build_number: ${{ steps.alloc.outputs.build_number }}
      version_name: ${{ steps.alloc.outputs.version_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Allocate build number
        id: alloc
        run: |
          set -euo pipefail
          git config user.email "ci@blokada.org"
          git config user.name "blokada-ci"
          ./scripts/build-number.sh allocate --start 1000 >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Build"
            echo "- number: \`${{ steps.alloc.outputs.build_number }}\`"
            echo "- version: \`${{ steps.alloc.outputs.version_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  translation_coverage:
    # Informational only: report per-locale coverage for the primary languages
    # to the run summary and warn (never fail) on anything below 100%, since
    # translation lag is normal. Independent of the build jobs -- no needs on
    # allocate, and nothing needs it -- so it runs in parallel and cannot
    # block this run. Pure python3 -> ubuntu-latest, off the self-hosted pool.
    #
    # Moved here from the retired release-tag.yml so lag surfaces on every
    # merge to main, days before release, instead of only at release time.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # only checks out, inits a submodule, and reports -- never pushes
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Coverage only reads deps/translate/langs.js; skip the heavy siblings.
      # continue-on-error on both steps keeps this job from ever reddening a
      # run: a red ci-release run means main is not publishable, and
      # translation lag -- which is normal -- must never produce that signal.
      - name: Init deps/translate submodule
        continue-on-error: true
        run: git submodule update --init --depth 1 deps/translate

      - name: Report per-locale coverage
        continue-on-error: true
        run: python3 .github/scripts/translation_coverage.py

  android:
    needs: allocate
    runs-on: [self-hosted, macOS, ARM64, build-only]
    timeout-minutes: 240
    permissions:
      contents: read # builds and uploads with its own secrets, never pushes to the repo
    strategy:
      fail-fast: false
      matrix:
        flavor: [six, family]
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FLAVOR: ${{ matrix.flavor }}
      BLOKADA_VERSION_NAME: ${{ needs.allocate.outputs.version_name }}
      BLOKADA_VERSION_CODE: ${{ needs.allocate.outputs.build_number }}
      BLOKADA_KEYSTORE_BASE64: ${{ secrets.BLOKADA_KEYSTORE_BASE64 }}
      BLOKADA_KEYSTORE_PWD: ${{ secrets.BLOKADA_KEYSTORE_PWD }}
      BLOKADA_KEY_PWD: ${{ secrets.BLOKADA_KEY_PWD }}
      GRADLE_OPTS: -Dorg.gradle.unsafe.disable.watch-fs=true -Dorg.gradle.vfs.watch=false
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build Android AAB
        run: |
          set -euo pipefail
          if [ "$FLAVOR" = "family" ]; then
            make ci-build-android-family
          else
            make ci-build-android-six
          fi

      - name: Upload to Play internal
        env:
          BLOKADA_GPLAY_KEY_BASE64: ${{ secrets.BLOKADA_GPLAY_KEY_BASE64 }}
        run: make publish-android FLAVOR="$FLAVOR"

      - name: Clean secrets
        if: always()
        run: |
          make gplay-key-clean
          rm -f android/keystore.jks

  ios:
    needs: allocate
    runs-on: [self-hosted, macOS, ARM64, build-only]
    timeout-minutes: 240
    permissions:
      contents: read # builds and uploads with its own secrets, never pushes to the repo
    strategy:
      fail-fast: false
      matrix:
        flavor: [six, family]
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      FLAVOR: ${{ matrix.flavor }}
      BLOKADA_VERSION_NAME: ${{ needs.allocate.outputs.version_name }}
      BLOKADA_VERSION_CODE: ${{ needs.allocate.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Unlock login keychain for codesign
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$KEYCHAIN_PASSWORD" ]; then
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" ~/Library/Keychains/login.keychain-db
          else
            echo "MAC_KEYCHAIN_PASSWORD is not set; leaving keychain as-is."
          fi

      - name: Build iOS IPA
        run: |
          set -euo pipefail
          if [ "$FLAVOR" = "family" ]; then
            make ci-build-ios-family
          else
            make ci-build-ios-six
          fi

      - name: Upload to TestFlight
        env:
          BLOKADA_APPSTORE_KEY_BASE64: ${{ secrets.BLOKADA_APPSTORE_KEY_BASE64 }}
        run: |
          set -uo pipefail

          # The upload often dies after ~60s with altool printing only
          # "The file Defaults.properties couldn't be opened", although the
          # runner reaches Apple fine. Record the environment around a failure.
          probe() {
            echo "::group::Environment probe ($1)"
            curl -s -o /dev/null -m 20 \
              -w "curl http=%{http_code} ip=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s err=%{errormsg}\n" \
              https://contentdelivery.itunes.apple.com/transporter/Defaults.properties \
              || echo "curl exited $?"
            xcrun -f altool || true
            ls -d /Applications/Transporter.app /usr/local/itms \
              ~/Library/Caches/com.apple.amp.itmstransporter 2>&1 || true
            env | cut -d= -f1 | grep -iE "proxy|developer_dir|itms|transporter|deliver|fastlane" || true
            echo "::endgroup::"
          }

          # Second attempt: altool directly with --verbose, so a failure shows
          # altool's own log rather than the two lines fastlane relays.
          # Presigned URL query strings and JWTs are stripped from the output.
          upload_direct() {
            local ipa keys log rc key_id issuer_id
            if [ "$FLAVOR" = "family" ]; then ipa="ios/Blokada Family.ipa"; else ipa="ios/Blokada 6.ipa"; fi
            keys=$(mktemp -d)
            log=$(mktemp)
            make appstore-key-unpack || return 1
            { read -r key_id; read -r issuer_id; } < <(ruby -rjson -rbase64 -e '
              k = JSON.parse(File.read("ios/blokada-appstore.json"))
              key = k["is_key_content_base64"] ? Base64.decode64(k["key"]) : k["key"]
              File.write(File.join(ARGV[0], "AuthKey_#{k["key_id"]}.p8"), key)
              puts k["key_id"], k["issuer_id"]' "$keys")
            make appstore-key-clean
            if [ -z "${key_id:-}" ] || [ -z "${issuer_id:-}" ]; then
              echo "::error::Could not read the App Store Connect key."
              rm -rf "$keys" "$log"
              return 1
            fi
            echo "::add-mask::$key_id"
            echo "::add-mask::$issuer_id"
            API_PRIVATE_KEYS_DIR="$keys" xcrun altool --upload-app -f "$ipa" -t ios \
              --apiKey "$key_id" --apiIssuer "$issuer_id" --verbose > "$log" 2>&1 \
              && rc=0 || rc=$?
            rm -rf "$keys"
            echo "::group::altool --verbose (exit $rc, $(wc -l < "$log") lines, first and last 150)"
            { head -n 150 "$log"; echo "[...]"; tail -n 150 "$log"; } \
              | sed -E 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[redacted-jwt]/g; s/\?[^ "]*/?[redacted-query]/g'
            echo "::endgroup::"
            rm -f "$log"
            return $rc
          }

          probe "before upload"
          started=$SECONDS
          if make publish-ios-testflight FLAVOR="$FLAVOR"; then
            exit 0
          fi
          elapsed=$((SECONDS - started))
          probe "after failed upload"

          # A failure this early happens before any bytes are sent, so the
          # same build number can be uploaded again.
          if [ "$elapsed" -ge 180 ]; then
            echo "::error::Upload failed after ${elapsed}s; not retrying."
            exit 1
          fi
          echo "::warning::Upload failed after ${elapsed}s; retrying once with altool directly."
          sleep 30
          upload_direct

      - name: Clean App Store key
        if: always()
        run: make appstore-key-clean
