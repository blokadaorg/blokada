name: Appium smoke (Android, emulator)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # workflow_run always uses main's copy of this file, so a PR that edits the
  # workflow would otherwise never run its own version.
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/appium-smoke-android.yml
  workflow_dispatch:

permissions:
  contents: read
  # Posts the "Appium smoke (Android)" commit status on the PR's head commit,
  # like appium-smoke.yml does for the iPhone run.
  statuses: write

# Latest commit wins per branch and trigger; workflow_dispatch runs always run.
# The trigger is in the key so the workflow_run run (main's copy of this file)
# cannot cancel the pull_request run of a PR that edits this workflow.
concurrency:
  group: appium-smoke-android-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.head_ref || github.run_id }}
  cancel-in-progress: true

# An extra check next to the iPhone suite, which stays the final one. Runs a
# subset of the smoke specs (see automation/appium/wdio/wdio.android.conf.ts)
# against a Google APIs emulator on a hosted runner. Same guards as the iOS
# workflow: same-repo PRs only, since the job reads the account secrets.
jobs:
  changes:
    name: Changed paths
    # Reads which areas the PR touched from the CI run's ci-changes artifact.
    # Without the artifact the smoke runs, so a missing result never skips it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      actions: read
    outputs:
      run: ${{ steps.read.outputs.run }}
    steps:
      - name: Read CI's changed paths
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = workflow_run ]; then
            if gh run download "$CI_RUN_ID" -R "$REPO" -n ci-changes -D ci-changes; then
              cat ci-changes/changes
              if grep -qx app=false ci-changes/changes && grep -qx appium=false ci-changes/changes; then
                run=false
              fi
            else
              echo "::warning::No ci-changes artifact on CI run $CI_RUN_ID; running the smoke."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  skipped:
    name: Report skipped smoke
    # Still posts the "Appium smoke (Android)" status, so a branch rule requiring
    # it passes.
    needs: changes
    if: needs.changes.outputs.run == 'false' && github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report smoke status as skipped
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"success\",\"context\":\"Appium smoke (Android)\",\"description\":\"skipped: no app changes\",\"target_url\":\"$RUN_URL\"}"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.run == 'true'
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      GRADLE_OPTS: -Dorg.gradle.unsafe.disable.watch-fs=true -Dorg.gradle.vfs.watch=false
      EMULATOR_API_LEVEL: "36"
    steps:
      - name: Report smoke status as pending
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"pending\",\"context\":\"Appium smoke (Android)\",\"description\":\"Running on the emulator\",\"target_url\":\"$RUN_URL\"}"

      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 1
          # Nothing here pushes; keep the token off the disk the specs run on.
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup-flutter

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: automation/appium/wdio/package-lock.json

      # Same build as the CI "Android assemble" job (non-mocked six debug), so
      # the specs restore the test account through the support chat as on iOS.
      - name: Build Flutter Android debug library
        run: make regen-android

      # Renders with Skia: the emulator's host renderer segfaults on Impeller's
      # OpenGL ES output (android/app/src/appiumSmoke/AndroidManifest.xml).
      - name: Assemble six debug APK
        env:
          ORG_GRADLE_PROJECT_appiumSmoke: "true"
        run: |
          make -C android apk-six-debug
          # Stop here, not mid-smoke, if the Skia flag did not reach the APK.
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)"
          "$aapt2" dump xmltree --file AndroidManifest.xml android/app/build/outputs/apk/six/debug/app-six-debug.apk \
            | grep -A2 'io.flutter.embedding.android.EnableImpeller' | grep -q '=false'
          echo "The APK renders with Skia (EnableImpeller=false)."

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.EMULATOR_API_LEVEL }}-google_apis-x86_64-pixel_6-v2

      - name: Cache Appium driver
        uses: actions/cache@v6
        with:
          path: automation/appium/.appium
          key: appium-uiautomator2-${{ hashFiles('automation/appium/wdio/scripts/run-wdio-android.mjs', 'automation/appium/wdio/package-lock.json') }}

      # Boots the new AVD once so the cached copy is past first-boot setup. No
      # snapshot: the smoke step always does a full boot (see below).
      - name: Create AVD
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          # The debug APK is ~260 MB; installs fail on the default data partition.
          disk-size: 8G
          cores: 4
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Created the AVD for caching."

      - name: "Run appium smoke (flavor: six)"
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          # Its own dev account, not the iOS smoke's: both runs go at once and
          # change the same account's settings (blocklists, exceptions). The
          # inactive one is read but unused by the Android subset.
          BLOKADA_ACTIVE_ACCOUNT_ID: ${{ secrets.BLOKADA_ANDROID_ACTIVE_ACCOUNT_ID }}
          BLOKADA_INACTIVE_ACCOUNT_ID: ${{ secrets.BLOKADA_INACTIVE_ACCOUNT_ID }}
          ANDROID_UDID: emulator-5554
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 8G
          # A full boot on 4 cores, never a restored snapshot. An emulator
          # restored from the quickboot snapshot kept dropping off adb mid-run
          # (host adb: "connection terminated: read failed"), which kills the
          # UiAutomator2 instrumentation: 33 of 58 runs lost specs that way,
          # against 1 of 12 full boots.
          cores: 4
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # run-health prints when the emulator dropped off adb, the cause of
          # "instrumentation process is not running" (see the script).
          script: bash automation/appium/wdio/scripts/android-run-health.sh start && (make appium-test-android; status=$?; bash automation/appium/wdio/scripts/android-run-health.sh report; exit $status)

      - name: Report smoke status result
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) state=success; desc="Smoke passed" ;;
            failure) state=failure; desc="Smoke failed" ;;
            *) state=error; desc="Smoke $JOB_STATUS" ;;
          esac
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            -d "{\"state\":\"$state\",\"context\":\"Appium smoke (Android)\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"

      - name: Publish per-scenario summary
        if: always()
        continue-on-error: true
        run: node automation/appium/wdio/scripts/junit-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # JUnit results and screenshots only. Page-source XML, logcat and the
      # Appium server log can hold the Private DNS hostname (it carries the
      # device tag), so they stay on the runner.
      - name: Upload appium smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appium-smoke-android-${{ github.run_id }}
          path: |
            automation/appium/output/junit/*.xml
            automation/appium/output/*.png
          if-no-files-found: warn
          retention-days: 14
